name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  # ring's bits of C and assembly, cross-compiled by clang: no C cross toolchain needed (it ships its own
  # headers); the Rust side links with rust-lld, see .cargo/config.toml
  CC_aarch64_unknown_linux_musl: clang
  CC_armv7_unknown_linux_musleabihf: clang
  CC_x86_64_unknown_linux_musl: clang

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p mfd-bosun -p neon-forwardscan
      - run: |
          for b in mfd-bosun neon-forwardscan; do
            cp target/${{ matrix.target }}/release/$b $b-${{ matrix.target }}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: '*-${{ matrix.target }}'

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p mfd-bosun -p neon-forwardscan
          done
          for b in mfd-bosun neon-forwardscan; do
            lipo -create -output $b-macos target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*-macos'

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-pc-windows-msvc -p mfd-bosun -p neon-forwardscan
      - run: |
          copy target\x86_64-pc-windows-msvc\release\mfd-bosun.exe mfd-bosun-windows-x86_64.exe
          copy target\x86_64-pc-windows-msvc\release\neon-forwardscan.exe neon-forwardscan-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*-windows-x86_64.exe'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mfd-bosun-*
            neon-forwardscan-*
