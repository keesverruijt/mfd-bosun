name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ring's bits of C and assembly, cross-compiled by clang: no C cross toolchain needed (it ships its own
  # headers); the Rust side links with rust-lld, see .cargo/config.toml
  CC_aarch64_unknown_linux_musl: clang
  CC_armv7_unknown_linux_musleabihf: clang
  CC_x86_64_unknown_linux_musl: clang

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p mfd-bosun
      # the binary, its systemd unit, /etc/default/mfd-bosun and install.sh, in mfd-bosun-<target>/
      - run: |
          d=mfd-bosun-${{ matrix.target }}
          mkdir $d
          install -m 755 target/${{ matrix.target }}/release/mfd-bosun packaging/install.sh $d/
          install -m 644 packaging/mfd-bosun.service packaging/mfd-bosun.default $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: mfd-bosun-${{ matrix.target }}.tar.gz

  macos:
    name: macos
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # the cfg(target_os) code for macOS is only compiled here
      - run: cargo clippy --all-targets -- -D warnings
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p mfd-bosun
          done
          lipo -create -output mfd-bosun-macos target/aarch64-apple-darwin/release/mfd-bosun target/x86_64-apple-darwin/release/mfd-bosun
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*-macos'

  windows:
    name: windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # the cfg(windows) code is only compiled here
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-msvc -p mfd-bosun
      - run: copy target\x86_64-pc-windows-msvc\release\mfd-bosun.exe mfd-bosun-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*-windows-x86_64.exe'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the builds to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mfd-bosun-*

  publish:
    # Every build of main, to keversoft.com: the key may only write there, into one web directory
    # (rrsync on the server), whose URL is known only to whom it is given.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'keesverruijt/mfd-bosun'
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # the one-line installers, which fetch the builds next to them (see README.md)
      - run: |
          git log -1 --format='%H %cI %s' > out/BUILD
          cp packaging/get.sh out/install.sh
          cp packaging/get.ps1 out/install.ps1
      - env:
          KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; echo "$KEY" > ~/.ssh/id_ed25519)
          echo 'keversoft.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINHEPZwbbeOUoOzQOQ2GRD4df0ebYQketV0/ZiIab8Ug' > ~/.ssh/known_hosts
          rsync -rt --chmod=D755,F644 --delete --delay-updates out/ mfd-bosun@keversoft.com:latest/
