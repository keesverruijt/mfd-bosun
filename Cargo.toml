[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Kees Verruijt <kees@verruijt.net>"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# h264-reader that accepts a NOS unit's SPS. See vendor/README.md.
[patch.crates-io]
h264-reader = { path = "vendor/h264-reader" }
