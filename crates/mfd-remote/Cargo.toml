[package]
name = "mfd-remote"
version = "0.1.0"
description = "Remote screen of Navico chartplotters in a browser: the NEON signalling proxy, the NOS bridge, and the page"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15.0"
log = "0.4.34"
mfd-net = { version = "0.1.0", path = "../mfd-net" }
retina = "0.4"
ring = { version = "0.17.14", default-features = false }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# str0m's crypto is our own (src/crypto), as str0m-rust-crypto's but without aws-lc
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
dimpl = { version = "0.7.4", default-features = false, features = ["rust-crypto"] }
hmac = "0.12.1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
sha1 = "0.10"
sha2 = "0.10"
str0m = { version = "0.24", default-features = false }
str0m-proto = { version = "0.7", default-features = false, features = ["dtls"] }
time = "0.3"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
url = "2.5.8"
