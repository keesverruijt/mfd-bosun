[package]
name = "mfd-remote"
version = "0.1.0"
description = "Remote screen of Navico chartplotters in a browser: the NEON signalling proxy, the NOS bridge, and the page"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15.0"
log = "0.4.34"
mfd-net = { version = "0.1.0", path = "../mfd-net" }
retina = "0.4"
ring = { version = "0.17.14", default-features = false }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
url = "2.5.8"
