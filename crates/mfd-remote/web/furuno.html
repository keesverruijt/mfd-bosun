<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Remote</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="remote.css">
<link rel="stylesheet" href="furuno.css">
</head>
<body>
<header id="bar">
  <a id="back" href="../" title="Chartplotters" aria-label="Chartplotters">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div id="title"><b id="name">Remote</b><span id="status">…</span></div>
</header>

<main id="remote">
  <!-- The MCU-006's joystick: drag to move the cursor (or, in SCROLL mode, to pan), tap to push it, two
       fingers (or a mouse wheel) turn the knob. In SCROLL mode its four directions show as arrows. -->
  <div id="pad">
    <span id="hint">Drag to move the cursor · tap to push · two fingers to zoom</span>
    <button type="button" class="arrow" data-dx="0" data-dy="-1" aria-label="Pan up"><svg viewBox="0 0 24 24"><path d="M12 5l8 12H4z"/></svg></button>
    <button type="button" class="arrow" data-dx="0" data-dy="1" aria-label="Pan down"><svg viewBox="0 0 24 24"><path d="M12 19L4 7h16z"/></svg></button>
    <button type="button" class="arrow" data-dx="-1" data-dy="0" aria-label="Pan left"><svg viewBox="0 0 24 24"><path d="M5 12l12-8v16z"/></svg></button>
    <button type="button" class="arrow" data-dx="1" data-dy="0" aria-label="Pan right"><svg viewBox="0 0 24 24"><path d="M19 12L7 20V4z"/></svg></button>
  </div>

  <div id="knob">
    <button type="button" data-knob="-1" aria-label="Turn the knob left (zoom out)">−</button>
    <button type="button" id="push" aria-label="Push the joystick (select)">Push</button>
    <button type="button" data-knob="1" aria-label="Turn the knob right (zoom in)">+</button>
  </div>

  <!-- The remote's keys in its own order, each with its icons (what it does, and held, its secondary
       function) as printed on it, and their names. data-key is the keyboard key it sends. -->
  <div id="keys">
    <button type="button" data-key="1" aria-label="Home; hold for Settings">
      <svg class="pri" viewBox="0 0 24 24"><path d="M2.5 11.5L12 4l9.5 7.5" fill="none" stroke="currentColor" stroke-width="2.8"/><path d="M5 14h14v3.5H5z"/></svg>
      <svg class="sec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="3.14 3.14"/><circle cx="12" cy="12" r="6.6"/><circle cx="12" cy="12" r="2.4" class="hole"/></svg>
      <span class="txt">Home · Settings</span>
    </button>
    <button type="button" data-key="2" aria-label="Event; hold for GOTO">
      <svg class="pri" viewBox="0 0 24 24"><path d="M12 22.5S5 14.8 5 9.6a7 7 0 0 1 14 0c0 5.2-7 12.9-7 12.9z"/><circle cx="12" cy="9.4" r="2.6" class="hole"/></svg>
      <b class="sec word">GOTO</b>
      <span class="txt">Event · GOTO</span>
    </button>
    <button type="button" id="keypad" aria-pressed="false" aria-label="CURS/SCRL: the joystick moves the cursor, or pans">
      <b class="pri word">CURS</b>
      <b class="sec word">SCRL</b>
      <span class="txt" id="keypad-mode">Cursor</span>
    </button>
    <button type="button" data-key="F5" aria-label="Cancel; hold for MOB">
      <svg class="pri" viewBox="0 0 24 24"><path d="M8.5 5L4 9.5 8.5 14" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4.5 9.5h10a5 5 0 0 1 5 5V17" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
      <svg class="sec red" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 9l3-3M9 9L6 6M9 15l-3 3M15 15l3 3" stroke="currentColor" stroke-width="2.6"/></svg>
      <span class="txt">Cancel · MOB</span>
    </button>
    <button type="button" data-key="F8" aria-label="CTRL, the active window; hold for full screen">
      <svg class="pri wide" viewBox="0 0 32 24"><rect x="2" y="3" width="28" height="18" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 3v18M2 12h28" stroke="currentColor" stroke-width="1.8"/><rect x="4.5" y="5.5" width="9" height="4.5"/></svg>
      <svg class="sec" viewBox="0 0 24 24"><path d="M3 3h7L3 10zM21 3v7l-7-7zM3 21v-7l7 7zM21 21h-7l7-7z"/></svg>
      <span class="txt">CTRL · Full screen</span>
    </button>
    <button type="button" data-key="F12" aria-label="Edge swipe; hold to switch MFD">
      <svg class="pri wide" viewBox="0 0 32 24"><rect x="2" y="3" width="28" height="18" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 9.5v5l3.5-2.5zM27 9.5v5l-3.5-2.5zM13.5 6h5L16 9zM13.5 18h5L16 15z"/></svg>
      <svg class="sec wide" viewBox="0 0 32 24"><rect x="1.5" y="6" width="29" height="12" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 6v12" stroke="currentColor" stroke-width="1.8"/><path d="M4 12l5-4v8zM28 12l-5 4V8z"/><path d="M8 12h16" stroke="currentColor" stroke-width="2"/></svg>
      <span class="txt">Edge · Switch MFD</span>
    </button>
    <button type="button" data-key="3" aria-label="NAV INFO; hold for F1">
      <b class="pri word">NAV INFO</b>
      <b class="sec word fkey">F1</b>
      <span class="txt">NAV INFO · F1</span>
    </button>
    <button type="button" data-key="4" aria-label="Gain; hold for F2">
      <b class="pri word">GAIN</b>
      <b class="sec word fkey">F2</b>
      <span class="txt">Gain · F2</span>
    </button>
    <button type="button" data-key="F4" aria-label="AUTO/STBY">
      <svg class="pri red" viewBox="0 0 24 24"><path d="M2.5 20L12 3.5 21.5 20h-4.6L12 11.5 7.1 20z"/></svg>
      <b class="sec word">STBY</b>
      <span class="txt">AUTO/STBY</span>
    </button>
    <button type="button" data-key="y" aria-label="Brill">
      <svg class="pri" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.4a4.6 4.6 0 0 0 0 9.2z"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5M4.6 4.6l2.4 2.4M17 17l2.4 2.4M4.6 19.4L7 17M17 7l2.4-2.4" stroke="currentColor" stroke-width="2"/></svg>
      <span class="txt">Brill</span>
    </button>
  </div>
  <p id="legend">Tap a key; hold it for its secondary function.</p>
</main>

<script type="module" src="furuno.js"></script>
</body>
</html>
