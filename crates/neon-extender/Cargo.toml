[package]
name = "neon-extender"
version = "0.1.0"
description = "One program on the boat network for Navico NEON chartplotters: their screens in a browser, and ForwardScan"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.34"
neon-forwardscan = { version = "1.0.0", path = "../neon-forwardscan" }
neon-net = { version = "0.1.0", path = "../neon-net" }
neon-remote = { version = "0.1.0", path = "../neon-remote" }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
tower = { version = "0.5.3", default-features = false }

[[bin]]
name = "navico-neon-extender"
path = "src/main.rs"
