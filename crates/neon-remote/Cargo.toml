[package]
name = "neon-remote"
version = "0.1.0"
description = "Remote screen of Navico NEON chartplotters in a browser: signalling proxy and page"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
log = "0.4.34"
neon-net = { version = "0.1.0", path = "../neon-net" }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
